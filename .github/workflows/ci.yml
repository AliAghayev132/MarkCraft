name: CI

# Every check that has to pass before a change is safe to keep. They were run
# by hand until now, which does not survive a second contributor.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} · type-check · lint · test
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing should not hide whether the others are fine —
      # that is the whole point of running three.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm

      # The Electron binary is a ~100 MB download this job never runs, and the
      # checks below only need the JavaScript.
      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Captured so a red run says what actually failed. Without this the only
      # public record is "exit code 1", and diagnosing a break that happens on
      # one platform and not another comes down to guessing.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Report the failures
        if: failure()
        shell: bash
        run: |
          {
            echo "### Tests failed on ${{ matrix.os }}"
            echo
            echo '```'
            tail -150 test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # And as an annotation. The step summary above is only visible in the
          # browser; an annotation is on the run itself and in the API, so a
          # red build can be diagnosed from anywhere.
          body=$(tail -60 test-output.txt | sed 's/%/%25/g; s/\r//g' | awk '{ printf "%s%%0A", $0 }')
          echo "::error title=Tests failed on ${{ matrix.os }}::${body}"

  build:
    name: Build bundles
    runs-on: ubuntu-latest
    # Building a broken bundle is not interesting; wait for the cheap checks.
    needs: verify

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm

      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # `npm run build` type-checks again; this step is only about proving the
      # three bundles still come out.
      - name: Build bundles
        run: npx electron-vite build
